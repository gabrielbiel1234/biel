<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Chat App</h1>
        </div>
        <div class="messages">
            <div class="message" id="user">Olá, Mundo!</div>
            <div class="message" id="bot">Olá!</div>
        </div>
        <div class="input">
            <input type="text" id="messageInput" placeholder="Digite sua mensagem...">
            <button id="sendMessageButton" class="btn">Enviar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
