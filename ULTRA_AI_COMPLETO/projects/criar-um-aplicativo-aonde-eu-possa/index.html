<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divida de Carro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Divida de Carro</h1>
    </header>
    <main>
        <section class="form">
            <h2>Marque o pagamento da divida</h2>
            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required><br>
                <label for="valor">Valor:</label>
                <input type="number" id="valor" name="valor" required><br>
                <label for="data">Data:</label>
                <input type="date" id="data" name="data" required><br>
                <button type="submit">Marcar Pagamento</button>
            </form>
        </section>
        <section class="resultados">
            <h2>Resultados</h2>
            <p>Seu pagamento foi marcado com sucesso!</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
